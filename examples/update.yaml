# yaml-language-server: $schema=../schema/update.schema.json
# Example system update config
#
# This file is executable configuration. Keep your real config owned by you and
# not group/world-writable.
#
# Supported step keys:
#   run     - trusted shell command, or list of commands, to execute
#   needs   - executable/path, or list of executables/paths, required to run
#   skip_if - trusted shell condition; skip the step when it exits 0
#   stat    - optional display values from before/after/version commands
#
# Use $UPDATE_TMPDIR for per-run scratch output files parsed by later stats.
# stat.version is exclusive with stat.before/stat.after.

Examples:
  simple command:
    run: tldr --update
    needs: tldr

  explicit needs and skip condition:
    run: sudo apt-get -qq update
    needs:
      - apt-get
      - sudo
    skip_if: 'pgrep -x apt >/dev/null 2>&1 || pgrep -x apt-get >/dev/null 2>&1 || pgrep -x dpkg >/dev/null 2>&1'

  captured output stats:
    run: 'bash -o pipefail -c ''sudo apt-get -y upgrade 2>&1 | tee "$UPDATE_TMPDIR/apt-upgrade-out.txt"'''
    needs:
      - apt-get
      - sudo
      - bash
    skip_if: 'pgrep -x apt >/dev/null 2>&1 || pgrep -x apt-get >/dev/null 2>&1 || pgrep -x dpkg >/dev/null 2>&1'
    stat:
      after:
        upgraded: 'grep -oP ''\d+(?= upgraded)'' "$UPDATE_TMPDIR/apt-upgrade-out.txt" || echo 0'
        held_back: 'grep -oP ''\d+(?= not upgraded)'' "$UPDATE_TMPDIR/apt-upgrade-out.txt" || echo 0'

  version tracking:
    run: uv self update
    needs: uv
    skip_if: 'pgrep -x uv >/dev/null 2>&1'
    stat:
      version: 'uv --version 2>/dev/null | grep -oP ''\d+\.\d+\.\d+'''

  multiple commands:
    run:
      - cargo install cargo-update 2>/dev/null || true
      - 'bash -o pipefail -c ''cargo install-update -a 2>&1 | tee "$UPDATE_TMPDIR/cargo-update-out.txt"'''
    needs:
      - cargo
      - bash
    skip_if: 'pgrep -x cargo >/dev/null 2>&1 || pgrep -x rustc >/dev/null 2>&1'
    stat:
      after:
        updated: 'grep -c ''Updating'' "$UPDATE_TMPDIR/cargo-update-out.txt" || echo 0'

  before and after stats:
    run: flatpak update -y --noninteractive
    needs: flatpak
    skip_if: 'pgrep -x flatpak >/dev/null 2>&1'
    stat:
      before:
        installed_before: 'flatpak list --app 2>/dev/null | wc -l'
      after:
        installed_after: 'flatpak list --app 2>/dev/null | wc -l'
